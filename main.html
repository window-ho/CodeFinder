<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>CodeFinder</title>
  <style>
    :root {
      --bg: #f4f6f3;
      --card: #ffffff;
      --ink: #182019;
      --muted: #58655a;
      --line: #d6dfd7;
      --primary: #1b5e20;
      --primary-soft: #e8f5e9;
      --accent: #b26a00;
      --accent-soft: #fff4e0;
      --warn-bg: #fff8e6;
      --warn-line: #f0c36d;
      --hi: #fff176;
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    input, textarea {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    body {
      margin: 0;
      padding: 16px 14px 36px;
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      font-size: 16px;
    }

    .wrap {
      max-width: 780px;
      margin: 0 auto;
    }

    .topbar {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .brand-title {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.3px;
    }

    .sub-pill {
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
    }

    .search-box {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1 1 240px;
      height: 50px;
      padding: 0 14px;
      font-size: 17px;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .btn {
      height: 50px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .btn-accent {
      background: var(--accent-soft);
      border-color: #e6b86a;
      color: var(--accent);
    }

    .disclaimer-box {
      background: var(--warn-bg);
      border: 1px solid var(--warn-line);
      color: #5c4008;
      border-radius: 12px;
      padding: 10px 13px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .card-title {
      margin: 0 0 10px;
      font-size: 17px;
      font-weight: 800;
      color: var(--ink);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #f9fbf9;
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .chip.multi {
      background: var(--accent-soft);
      border-color: #e6b86a;
      color: var(--accent);
    }

    .chip.saved {
      background: var(--primary-soft);
      border-color: #9ccc9f;
      color: var(--primary);
    }

    .result-hero {
      border: 2px solid var(--primary);
      background: #f8fcf8;
    }

    .code-badge {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .result-name {
      margin: 4px 0 6px;
      font-size: 22px;
      font-weight: 800;
    }

    .result-desc {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 15px;
    }

    .purpose-box {
      background: var(--warn-bg);
      border: 2px solid var(--warn-line);
      border-radius: 14px;
      padding: 14px;
      margin-top: 10px;
    }

    .purpose-title {
      font-size: 16px;
      font-weight: 800;
      color: #6d4700;
      margin: 0 0 10px;
    }

    .purpose-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .tab {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .item-row {
      border-top: 1px solid var(--line);
      padding: 12px 2px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .item-row:first-child {
      border-top: none;
    }

    .item-code {
      min-width: 54px;
      text-align: center;
      font-weight: 800;
      font-size: 16px;
      padding: 4px 8px;
      border-radius: 8px;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .item-body {
      flex: 1;
    }

    .item-head {
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 2px;
    }

    .item-sub {
      font-size: 14px;
      color: var(--muted);
    }

    mark {
      background: var(--hi);
      color: inherit;
      padding: 0 2px;
      border-radius: 3px;
    }

    .status-msg {
      margin-top: 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand-row">
        <h1 class="brand-title">CodeFinder</h1>
        <span class="sub-pill">품목 · 상표 · 용도 자동 판별</span>
      </div>
      <div class="search-box">
        <input
          id="searchInput"
          class="search-input"
          type="text"
          placeholder="품목명이나 상표명을 입력하세요 (예: 요소, 인비, 톤백, 멀칭비닐)"
          autocomplete="off"
        />
        <button id="lookupBtn" class="btn btn-primary" type="button">🌐 인터넷·AI 판별</button>
        <button id="clearBtn" class="btn" type="button">지우기</button>
      </div>
      <div id="statusMsg" class="status-msg"></div>
    </div>

    <div id="topResultCard" class="card result-hero" style="display:none;"></div>

    <div class="card">
      <div class="disclaimer-box">
        ⚠️ 본 검색 및 판별 결과는 참고용이며, 실제 장부 기입 및 최종 분류 판단과 책임은 사용자 본인에게 있습니다.
      </div>
      <h2 class="card-title">자주 찾는 상표명 · 용도구분</h2>
      <div id="quickChips" class="chips"></div>
    </div>

    <div id="notebookCard" class="card" style="display:none;">
      <h2 class="card-title">📒 내 제품 수첩</h2>
      <div id="notebookChips" class="chips"></div>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab active" data-cat="전체" type="button">전체</button>
        <button class="tab" data-cat="재료비" type="button">재료비</button>
        <button class="tab" data-cat="노무비" type="button">노무비</button>
        <button class="tab" data-cat="경비" type="button">경비</button>
      </div>
      <div id="codeList"></div>
    </div>

    <footer class="footer">
      © windowho@korea.kr
    </footer>
  </div>

        term: "콘티박스",
        question: "콘티박스의 주된 사용처를 선택해 주세요.",
        options: [
          { label: "🌱 농작업·보관·운반에 사용 (→ 109 기타)", code: "109", purposeText: "작업·보관용" },
          { label: "📦 농산물 출하·판매 용기로 사용 (→ 132 판매자재)", code: "132", purposeText: "출하·판매용" }
        ]
      },
      {
        term: "양파망",
        question: "양파망을 어느 쪽으로 쓰셨나요?",
        options: [
          { label: "🌱 보관·밭일 용도로 사용 (→ 109 기타)", code: "109", purposeText: "보관·작업용" },
          { label: "📦 수확물 판매·출하 포장에 사용 (→ 132 판매자재)", code: "132", purposeText: "출하·판매용" }
        ]
      },
      {
        term: "가위",
        question: "가위 구입의 성격을 선택해 주세요.",
        options: [
          { label: "✂️ 전정·수확 등 50만원 미만 소농구 (→ 123 소농구구입비)", code: "123", purposeText: "소농구용" },
          { label: "📦 출하·포장 작업 자재로 사용 (→ 132 판매자재)", code: "132", purposeText: "출하·포장용" }
        ]
      }
    ];

    let currentCategory = "전체";
    let selectedOverrideCode = null;
    let selectedPurposeLabel = null;

    function highlightText(text, query) {
      if (!query) return text;
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return text.replace(new RegExp(`(${escaped})`, "gi"), "<mark>$1</mark>");
    }

    function getSavedItems() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch (e) {
        return [];
      }
    }

    function saveItemToNotebook(name, code, purposeText) {
      const displayLabel = purposeText ? `${name} (${purposeText})` : name;
      const items = getSavedItems();
      const filtered = items.filter((it) => it.label !== displayLabel);
      filtered.unshift({ label: displayLabel, code, rawName: name, purposeText: purposeText || "" });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(filtered.slice(0, 30)));
      renderNotebook();
      setStatus(`'${displayLabel}' (부호 ${code}) 내 제품 수첩에 저장됨`);
    }

    function setStatus(msg) {
      document.getElementById("statusMsg").textContent = msg;
    }

    function findMultiPurpose(q) {
      const clean = q.trim().toLowerCase();
      if (!clean) return null;
      return MULTI_PURPOSE_ITEMS.find((m) => clean.includes(m.term.toLowerCase()) || m.term.toLowerCase().includes(clean));
    }

    function findBrand(q) {
      const clean = q.trim().toLowerCase();
      if (!clean) return null;
      return BRAND_DICT.find((b) => clean.includes(b.term.toLowerCase()) || b.term.toLowerCase().includes(clean));
    }

    function findSavedMatch(q) {
      const clean = q.trim().toLowerCase();
      if (!clean) return null;
      return getSavedItems().find((s) => s.label.toLowerCase().includes(clean) || s.rawName.toLowerCase().includes(clean));
    }

    function findBestCategory(q) {
      const clean = q.trim().toLowerCase();
      if (!clean) return null;

      for (const item of CATEGORIES) {
        if (item.code === clean || item.name.toLowerCase().includes(clean)) {
          return { item, reason: `${item.name} 항목과 직접 일치합니다.` };
        }
      }
      for (const item of CATEGORIES) {
        if (item.keywords.some((k) => k.toLowerCase().includes(clean) || clean.includes(k.toLowerCase()))) {
          return { item, reason: `입력하신 단어와 '${item.name}' 관련 키워드가 연결되었습니다.` };
        }
      }
      for (const item of CATEGORIES) {
        if (item.desc.toLowerCase().includes(clean)) {
          return { item, reason: `항목 설명에 '${q}' 내용이 포함되어 있습니다.` };
        }
      }
      return null;
    }

    function inferOnlineHeuristic(q) {
      const s = q.toLowerCase();
      if (/요소|인비|유안|복합|질소|인산|칼리|퇴비|비료|영양제|아미노산|부식산|규산|고토/.test(s)) {
        return { code: "102", reason: "비료·영양제·토양개량 자재 계열로 추정됩니다." };
      }
      if (/제초|살충|살균|약제|진딧물|응애|곰팡이|방제|전착|발근|소독/.test(s)) {
        return { code: "103", reason: "작물보호제·농약 계열 제품으로 추정됩니다." };
      }
      if (/사료|조사료|건초|곤포|배합|펠릿|무기질사료/.test(s)) {
        return { code: "105", reason: "가축 사료 계열 제품으로 추정됩니다." };
      }
      if (/박스|상자|포장|봉투|마대|테이프|라벨|출하|판매/.test(s)) {
        return { code: "132", reason: "출하·포장용 판매자재 계열로 추정됩니다." };
      }
      if (/비닐|멀칭|톤백|노끈|지주|상토|호스|망|끈/.test(s)) {
        return { code: "109", reason: "현장 자재(109 기타)로 우선 분류되며, 사용처에 따라 부호가 달라질 수 있습니다." };
      }
      return { code: "109", reason: "일상·신제품 명칭으로 우선 기타(109)로 분류했습니다. 실제 용도를 꼭 확인해 주세요." };
    }

    function renderTopResult() {
      const rawQuery = document.getElementById("searchInput").value.trim();
      const hero = document.getElementById("topResultCard");

      if (!rawQuery && !selectedOverrideCode) {
        hero.style.display = "none";
        hero.innerHTML = "";
        return;
      }

      const multi = findMultiPurpose(rawQuery);
      const savedMatch = findSavedMatch(rawQuery);
      const brandMatch = findBrand(rawQuery);
      const catMatch = findBestCategory(rawQuery);

      let activeCode = selectedOverrideCode;
      let titleText = rawQuery || "선택된 품목";
      let reasonText = "";
      let showPurposeSelector = false;
      let purposeOptions = [];

      if (multi) {
        showPurposeSelector = true;
        purposeOptions = multi.options;
        if (!activeCode) {
          activeCode = multi.options[0].code;
          reasonText = `${multi.question} 아래 버튼을 눌러 용도를 확정해 주세요.`;
        } else {
          reasonText = `선택하신 용도(${selectedPurposeLabel || ""}) 기준으로 반영되었습니다.`;
        }
      } else if (savedMatch) {
        activeCode = activeCode || savedMatch.code;
        titleText = savedMatch.label;
        reasonText = `내 제품 수첩에 저장된 항목입니다.`;
      } else if (brandMatch) {
        activeCode = activeCode || brandMatch.code;
        titleText = `${rawQuery} (${brandMatch.term})`;
        reasonText = brandMatch.reason;
      } else if (catMatch) {
        activeCode = activeCode || catMatch.item.code;
        titleText = `${rawQuery} → ${catMatch.item.name}`;
        reasonText = catMatch.reason;
      } else if (activeCode) {
        reasonText = "직접 선택하거나 판별된 부호입니다.";
      } else {
        hero.style.display = "none";
        hero.innerHTML = "";
        return;
      }

      const codeObj = CATEGORIES.find((c) => c.code === activeCode) || CATEGORIES[5];

      let purposeHtml = "";
      if (showPurposeSelector) {
        const buttonsHtml = purposeOptions
          .map(
            (opt) =>
              `<button class="btn btn-accent" type="button" onclick="choosePurpose('${rawQuery.replace(/'/g, "\\'")}', '${opt.code}', '${opt.purposeText.replace(/'/g, "\\'")}')">${opt.label}</button>`
          )
          .join("");

        purposeHtml = `
          <div class="purpose-box">
            <p class="purpose-title">⚠️ 용도에 따라 부호가 달라집니다! ${multi.question}</p>
            <div class="purpose-actions">${buttonsHtml}</div>
            <button class="btn btn-primary" type="button" onclick="saveCurrentToNotebook('${rawQuery.replace(/'/g, "\\'")}', '${codeObj.code}', '${(selectedPurposeLabel || purposeOptions[0].purposeText).replace(/'/g, "\\'")}')">
              📒 용도 포함 수첩 저장
            </button>
          </div>
        `;
      } else {
        purposeHtml = `
          <div style="margin-top:8px;">
            <button class="btn" type="button" onclick="saveCurrentToNotebook('${rawQuery.replace(/'/g, "\\'")}', '${codeObj.code}', '${(selectedPurposeLabel || "").replace(/'/g, "\\'")}')">
              📒 내 제품 수첩에 저장
            </button>
          </div>
        `;
      }

      hero.style.display = "block";
      hero.innerHTML = `
        <div class="code-badge">부호 ${codeObj.code} · ${codeObj.name}</div>
        <h2 class="result-name">${highlightText(titleText, rawQuery)}</h2>
        <p class="result-desc">${reasonText} <br/>구분: ${codeObj.cat} | 단위: ${codeObj.unit} | 설명: ${codeObj.desc}</p>
        ${purposeHtml}
      `;
    }

    window.choosePurpose = function (queryTerm, code, purposeText) {
      selectedOverrideCode = code;
      selectedPurposeLabel = purposeText;
      renderTopResult();
      setStatus(`'${queryTerm}' → ${purposeText} (부호 ${code}) 확정`);
    };

    window.saveCurrentToNotebook = function (queryTerm, code, purposeText) {
      const targetName = queryTerm || code;
      saveItemToNotebook(targetName, code, purposeText);
    };

    function renderQuickChips() {
      const wrap = document.getElementById("quickChips");
      wrap.innerHTML = "";

      BRAND_DICT.forEach((b) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.textContent = `${b.term} (${b.code})`;
        btn.onclick = () => {
          selectedOverrideCode = null;
          selectedPurposeLabel = null;
          document.getElementById("searchInput").value = b.term;
          setStatus(`상표 '${b.term}' 검색`);
          renderTopResult();
          renderCodeList();
        };
        wrap.appendChild(btn);
      });

      MULTI_PURPOSE_ITEMS.forEach((m) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip multi";
        btn.textContent = `용도구분: ${m.term}`;
        btn.onclick = () => {
          selectedOverrideCode = null;
          selectedPurposeLabel = null;
          document.getElementById("searchInput").value = m.term;
          setStatus(`다용도 품목 '${m.term}' 용도 선택`);
          renderTopResult();
          renderCodeList();
        };
        wrap.appendChild(btn);
      });
    }

    function renderNotebook() {
      const items = getSavedItems();
      const card = document.getElementById("notebookCard");
      const wrap = document.getElementById("notebookChips");
      if (!items.length) {
        card.style.display = "none";
        return;
      }
      card.style.display = "block";
      wrap.innerHTML = "";
      items.forEach((it) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip saved";
        btn.textContent = `${it.label} · ${it.code}`;
        btn.onclick = () => {
          selectedOverrideCode = it.code;
          selectedPurposeLabel = it.purposeText || "";
          document.getElementById("searchInput").value = it.rawName || it.label;
          setStatus(`저장된 '${it.label}' 불러옴`);
          renderTopResult();
          renderCodeList();
        };
        wrap.appendChild(btn);
      });
    }

    function renderCodeList() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const listEl = document.getElementById("codeList");

      const filtered = CATEGORIES.filter((c) => {
        const catOk = currentCategory === "전체" || c.cat === currentCategory;
        if (!catOk) return false;
        if (!q) return true;
        return (
          c.code.includes(q) ||
          c.name.toLowerCase().includes(q) ||
          c.desc.toLowerCase().includes(q) ||
          c.keywords.some((k) => k.toLowerCase().includes(q))
        );
      });

      if (!filtered.length) {
        listEl.innerHTML = `<div class="item-row"><div class="item-body">일치하는 항목이 없습니다. 상단의 <strong>🌐 인터넷·AI 판별</strong> 버튼을 눌러 보세요.</div></div>`;
        return;
      }

      listEl.innerHTML = filtered
        .map(
          (c) => `
          <div class="item-row">
            <div class="item-code">${c.code}</div>
            <div class="item-body">
              <div class="item-head">${highlightText(c.name, q)} <span style="font-size:13px;font-weight:600;color:var(--muted);">[${c.cat} · ${c.unit}]</span></div>
              <div class="item-sub">${highlightText(c.desc, q)}</div>
            </div>
          </div>
        `
        )
        .join("");
    }

    async function runOnlineLookup() {
      const q = document.getElementById("searchInput").value.trim();
      if (!q) {
        setStatus("판별할 제품명이나 품목명을 먼저 입력해 주세요.");
        return;
      }

      setStatus(`'${q}' 인터넷·AI 판별 중...`);

      const multi = findMultiPurpose(q);
      if (multi) {
        selectedOverrideCode = null;
        selectedPurposeLabel = null;
        renderTopResult();
        setStatus(`'${q}'는 용도 선택이 필요한 품목입니다.`);
        return;
      }

      const brand = findBrand(q);
      if (brand) {
        selectedOverrideCode = brand.code;
        selectedPurposeLabel = "";
        renderTopResult();
        setStatus(`상표 사전 확인 완료 → 부호 ${brand.code}`);
        return;
      }

      try {
        const url = `https://ko.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(q)}&limit=3&namespace=0&format=json&origin=*`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          const titles = data[1] || [];
          const descs = data[2] || [];
          const combinedText = `${q} ${titles.join(" ")} ${descs.join(" ")}`;
          const guessed = inferOnlineHeuristic(combinedText);
          selectedOverrideCode = guessed.code;
          selectedPurposeLabel = "";
          renderTopResult();
          setStatus(`인터넷 정보 참고 판별 완료 → 부호 ${guessed.code} (${guessed.reason})`);
          return;
        }
      } catch (e) {
        // 오프라인 또는 네트워크 차단 시 기본 규칙으로 판별
      }

      const fallback = inferOnlineHeuristic(q);
      selectedOverrideCode = fallback.code;
      selectedPurposeLabel = "";
      renderTopResult();
      setStatus(`기본 판별 적용 → 부호 ${fallback.code} (${fallback.reason})`);
    }

    document.getElementById("searchInput").addEventListener("input", () => {
      selectedOverrideCode = null;
      selectedPurposeLabel = null;
      setStatus("");
      renderTopResult();
      renderCodeList();
    });

    document.getElementById("searchInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const q = document.getElementById("searchInput").value.trim();
        if (q && !findMultiPurpose(q) && !findBrand(q) && !findBestCategory(q) && !findSavedMatch(q)) {
          runOnlineLookup();
        }
      }
    });

    document.getElementById("lookupBtn").addEventListener("click", runOnlineLookup);

    document.getElementById("clearBtn").addEventListener("click", () => {
      document.getElementById("searchInput").value = "";
      selectedOverrideCode = null;
      selectedPurposeLabel = null;
      setStatus("");
      renderTopResult();
      renderCodeList();
    });

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        currentCategory = tab.dataset.cat;
        renderCodeList();
      });
    });

    document.addEventListener("contextmenu", (e) => e.preventDefault());
    document.addEventListener("copy", (e) => {
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag !== "INPUT" && tag !== "TEXTAREA") {
        e.preventDefault();
      }
    });
    document.addEventListener("selectstart", (e) => {
      const tag = e.target && e.target.tagName;
      if (tag !== "INPUT" && tag !== "TEXTAREA") {
        e.preventDefault();
      }
    });

    renderQuickChips();
    renderNotebook();
    renderCodeList();
  </script>
</body>
</html>
