<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>CodeFinder</title>
  <style>
    :root {
      --bg: #f3f6f4;
      --surface: #ffffff;
      --ink: #17211b;
      --muted: #526358;
      --line: #d5dfd8;
      --brand: #1b5e20;
      --brand-2: #2e7d32;
      --brand-bg: #e8f5e9;
      --warn: #8a4b00;
      --warn-bg: #fff6e5;
      --warn-line: #f2c572;
      --hi: #fff176;
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    input, textarea {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    body {
      margin: 0;
      padding: 18px 14px 40px;
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    .header-box {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(27, 94, 32, 0.16);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .app-title {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .header-badge {
      background: rgba(255, 255, 255, 0.18);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }

    .search-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1 1 240px;
      height: 52px;
      padding: 0 16px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    .btn {
      height: 52px;
      padding: 0 16px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-search {
      background: #ffd54f;
      color: #1f291f;
    }

    .btn-clear {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .btn-purpose {
      height: auto;
      min-height: 46px;
      padding: 10px 14px;
      background: #fff;
      color: var(--warn);
      border: 2px solid var(--warn-line);
      text-align: left;
    }

    .btn-save {
      height: 44px;
      padding: 0 14px;
      background: var(--brand);
      color: #fff;
      font-size: 14px;
    }

    .status-bar {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 700;
      min-height: 20px;
      color: #fffde7;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .hero-panel {
      border: 2px solid var(--brand);
      background: #f8fcf8;
    }

    .code-pill {
      display: inline-block;
      background: var(--brand);
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .hero-title {
      margin: 4px 0 6px;
      font-size: 22px;
      font-weight: 800;
    }

    .hero-desc {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 15px;
    }

    .purpose-card {
      background: var(--warn-bg);
      border: 2px solid var(--warn-line);
      border-radius: 14px;
      padding: 14px;
      margin-top: 10px;
    }

    .purpose-q {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 800;
      color: var(--warn);
    }

    .purpose-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .disclaimer-notice {
      background: var(--warn-bg);
      border: 1px solid var(--warn-line);
      color: var(--warn);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .panel-heading {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 800;
      color: var(--ink);
    }

    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip-btn {
      padding: 9px 13px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #f6f9f7;
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .chip-btn.multi-chip {
      background: var(--warn-bg);
      border-color: var(--warn-line);
      color: var(--warn);
    }

    .chip-btn.saved-chip {
      background: var(--brand-bg);
      border-color: #a5d6a7;
      color: var(--brand);
    }

    .cat-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .cat-tab {
      padding: 9px 15px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .cat-tab.active {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .list-item {
      border-top: 1px solid var(--line);
      padding: 12px 4px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .list-item:first-child {
      border-top: none;
    }

    .list-code {
      min-width: 54px;
      text-align: center;
      background: var(--brand-bg);
      color: var(--brand);
      font-size: 16px;
      font-weight: 800;
      padding: 5px 8px;
      border-radius: 8px;
    }

    .list-title {
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 2px;
    }

    .list-sub {
      font-size: 14px;
      color: var(--muted);
    }

    mark {
      background: var(--hi);
      color: inherit;
      padding: 0 2px;
      border-radius: 3px;
    }

    .bottom-copyright {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      margin-top: 26px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header-box">
      <div class="header-top">
        <h1 class="app-title">CodeFinder</h1>
        <span class="header-badge">품목 · 상표 · 용도 자동 검색</span>
      </div>
      <div class="search-row">
        <input
          id="searchInput"
          class="search-input"
          type="text"
          placeholder="품목명이나 상표명 입력 (예: 요소, 인비, 톤백, 멀칭비닐)"
          autocomplete="off"
        />
        <button id="lookupBtn" class="btn btn-search" type="button">🌐 인터넷·AI 판별</button>
        <button id="clearBtn" class="btn btn-clear" type="button">지우기</button>
      </div>
      <div id="statusBar" class="status-bar"></div>
    </header>

    <section id="heroPanel" class="panel hero-panel" style="display:none;"></section>

    <section class="panel">
      <div class="disclaimer-notice">
        ⚠️ 본 검색 및 판별 결과는 참고용이며, 실제 장부 기입 및 최종 분류 판단과 책임은 사용자 본인에게 있습니다.
      </div>
      <h2 class="panel-heading">자주 찾는 상표명 · 용도구분</h2>
      <div id="quickChips" class="chip-group"></div>
    </section>

    <section id="notebookPanel" class="panel" style="display:none;">
      <h2 class="panel-heading">📒 내 제품 수첩</h2>
      <div id="notebookChips" class="chip-group"></div>
    </section>

    <section class="panel">
      <div class="cat-tabs">
        <button class="cat-tab active" data-cat="전체" type="button">전체</button>
        <button class="cat-tab" data-cat="재료비" type="button">재료비</button>
        <button class="cat-tab" data-cat="노무비" type="button">노무비</button>
        <button class="cat-tab" data-cat="경비" type="button">경비</button>
      </div>
      <div id="codeList"></div>
    </section>

    <footer class="bottom-copyright">© windowho@korea.kr</footer>
  </div>

      {
        term: "콘티박스",
        question: "콘티박스의 주된 사용처를 선택해 주세요.",
        options: [
          { label: "🌱 농작업·보관·운반에 사용 (→ 109 기타)", code: "109", purposeText: "작업·보관용" },
          { label: "📦 농산물 출하·판매 용기로 사용 (→ 132 판매자재)", code: "132", purposeText: "출하·판매용" }
        ]
      },
      {
        term: "양파망",
        question: "양파망을 어느 쪽으로 쓰셨나요?",
        options: [
          { label: "🌱 보관·밭일 용도로 사용 (→ 109 기타)", code: "109", purposeText: "보관·작업용" },
          { label: "📦 수확물 판매·출하 포장에 사용 (→ 132 판매자재)", code: "132", purposeText: "출하·판매용" }
        ]
      },
      {
        term: "가위",
        question: "가위 구입의 성격을 선택해 주세요.",
        options: [
          { label: "✂️ 전정·수확 등 50만원 미만 소농구 (→ 123 소농구구입비)", code: "123", purposeText: "소농구용" },
          { label: "📦 출하·포장 작업 자재로 사용 (→ 132 판매자재)", code: "132", purposeText: "출하·포장용" }
        ]
      }
    ];

    let activeCat = "전체";
    let overrideCode = null;
    let overridePurpose = "";

    function highlight(text, q) {
      if (!q) return text;
      const esc = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return text.replace(new RegExp(`(${esc})`, "gi"), "<mark>$1</mark>");
    }

    function setStatus(msg) {
      document.getElementById("statusBar").textContent = msg;
    }

    function loadNotebook() {
      try {
        return JSON.parse(localStorage.getItem(NOTEBOOK_KEY) || "[]");
      } catch (e) {
        return [];
      }
    }

    function saveNotebookItem(name, code, purposeText) {
      const label = purposeText ? `${name} (${purposeText})` : name;
      const list = loadNotebook().filter((x) => x.label !== label);
      list.unshift({ label, code, rawName: name, purposeText: purposeText || "" });
      localStorage.setItem(NOTEBOOK_KEY, JSON.stringify(list.slice(0, 30)));
      renderNotebook();
      setStatus(`'${label}' (부호 ${code}) 내 제품 수첩에 저장됨`);
    }

    function matchMulti(q) {
      const s = q.trim().toLowerCase();
      if (!s) return null;
      return MULTI_ITEMS.find((m) => s.includes(m.term.toLowerCase()) || m.term.toLowerCase().includes(s));
    }

    function matchBrand(q) {
      const s = q.trim().toLowerCase();
      if (!s) return null;
      return BRANDS.find((b) => s.includes(b.term.toLowerCase()) || b.term.toLowerCase().includes(s));
    }

    function matchSaved(q) {
      const s = q.trim().toLowerCase();
      if (!s) return null;
      return loadNotebook().find((x) => x.label.toLowerCase().includes(s) || x.rawName.toLowerCase().includes(s));
    }

    function matchCategory(q) {
      const s = q.trim().toLowerCase();
      if (!s) return null;
      for (const item of EXPENSE_ITEMS) {
        if (item.code === s || item.name.toLowerCase().includes(s)) {
          return { item, reason: `${item.name} 항목과 일치합니다.` };
        }
      }
      for (const item of EXPENSE_ITEMS) {
        if (item.keywords.some((k) => k.toLowerCase().includes(s) || s.includes(k.toLowerCase()))) {
          return { item, reason: `'${item.name}' 관련 키워드와 연결되었습니다.` };
        }
      }
      for (const item of EXPENSE_ITEMS) {
        if (item.desc.toLowerCase().includes(s)) {
          return { item, reason: `항목 설명에 '${q}' 내용이 포함되어 있습니다.` };
        }
      }
      return null;
    }

    function guessByText(q) {
      const s = q.toLowerCase();
      if (/요소|인비|유안|복합|질소|인산|칼리|퇴비|비료|영양제|아미노산|부식산|규산|고토/.test(s)) {
        return { code: "102", reason: "비료·영양제·토양개량 자재 계열로 추정됩니다." };
      }
      if (/제초|살충|살균|약제|진딧물|응애|곰팡이|방제|전착|발근|소독/.test(s)) {
        return { code: "103", reason: "작물보호제·농약 계열 제품으로 추정됩니다." };
      }
      if (/사료|조사료|건초|곤포|배합|펠릿|무기질사료/.test(s)) {
        return { code: "105", reason: "가축 사료 계열 제품으로 추정됩니다." };
      }
      if (/박스|상자|포장|봉투|마대|테이프|라벨|출하|판매/.test(s)) {
        return { code: "132", reason: "출하·포장용 판매자재 계열로 추정됩니다." };
      }
      return { code: "109", reason: "현장 자재(109 기타)로 우선 분류했습니다. 실제 사용처를 확인해 주세요." };
    }

    function renderHero() {
      const q = document.getElementById("searchInput").value.trim();
      const panel = document.getElementById("heroPanel");

      if (!q && !overrideCode) {
        panel.style.display = "none";
        panel.innerHTML = "";
        return;
      }

      const multi = matchMulti(q);
      const saved = matchSaved(q);
      const brand = matchBrand(q);
      const cat = matchCategory(q);

      let code = overrideCode;
      let heading = q || "선택 항목";
      let reason = "";

      if (multi) {
        code = code || multi.options[0].code;
        reason = overridePurpose
          ? `선택하신 용도(${overridePurpose}) 기준으로 반영되었습니다.`
          : `${multi.question} 아래 버튼을 눌러 용도를 확정해 주세요.`;
      } else if (saved) {
        code = code || saved.code;
        heading = saved.label;
        reason = "내 제품 수첩에 저장된 항목입니다.";
      } else if (brand) {
        code = code || brand.code;
        heading = `${q} (${brand.term})`;
        reason = brand.reason;
      } else if (cat) {
        code = code || cat.item.code;
        heading = `${q} → ${cat.item.name}`;
        reason = cat.reason;
      } else if (code) {
        reason = "판별 또는 선택된 부호입니다.";
      } else {
        panel.style.display = "none";
        panel.innerHTML = "";
        return;
      }

      const obj = EXPENSE_ITEMS.find((x) => x.code === code) || EXPENSE_ITEMS[5];

      let purposeBlock = "";
      if (multi) {
        const btns = multi.options
          .map(
            (opt) =>
              `<button class="btn btn-purpose" type="button" onclick="selectPurpose('${q.replace(/'/g, "\\'")}', '${opt.code}', '${opt.purposeText.replace(/'/g, "\\'")}')">${opt.label}</button>`
          )
          .join("");
        purposeBlock = `
          <div class="purpose-card">
            <p class="purpose-q">⚠️ 용도에 따라 부호가 달라집니다! ${multi.question}</p>
            <div class="purpose-btns">${btns}</div>
            <button class="btn btn-save" type="button" onclick="saveNotebookItem('${q.replace(/'/g, "\\'")}', '${obj.code}', '${(overridePurpose || multi.options[0].purposeText).replace(/'/g, "\\'")}')">📒 용도 포함 수첩 저장</button>
          </div>
        `;
      } else {
        purposeBlock = `
          <button class="btn btn-save" type="button" onclick="saveNotebookItem('${q.replace(/'/g, "\\'")}', '${obj.code}', '${overridePurpose.replace(/'/g, "\\'")}')">📒 내 제품 수첩에 저장</button>
        `;
      }

      panel.style.display = "block";
      panel.innerHTML = `
        <div class="code-pill">부호 ${obj.code} · ${obj.name}</div>
        <h2 class="hero-title">${highlight(heading, q)}</h2>
        <p class="hero-desc">${reason}<br/>구분: ${obj.cat} | 단위: ${obj.unit} | 설명: ${obj.desc}</p>
        ${purposeBlock}
      `;
    }

    window.selectPurpose = function (q, code, purposeText) {
      overrideCode = code;
      overridePurpose = purposeText;
      renderHero();
      setStatus(`'${q}' → ${purposeText} (부호 ${code}) 확정`);
    };

    function renderQuickChips() {
      const wrap = document.getElementById("quickChips");
      wrap.innerHTML = "";

      BRANDS.forEach((b) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip-btn";
        btn.textContent = `${b.term} (${b.code})`;
        btn.onclick = () => {
          overrideCode = null;
          overridePurpose = "";
          document.getElementById("searchInput").value = b.term;
          setStatus(`상표 '${b.term}' 검색`);
          renderHero();
          renderList();
        };
        wrap.appendChild(btn);
      });

      MULTI_ITEMS.forEach((m) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip-btn multi-chip";
        btn.textContent = `용도구분: ${m.term}`;
        btn.onclick = () => {
          overrideCode = null;
          overridePurpose = "";
          document.getElementById("searchInput").value = m.term;
          setStatus(`다용도 품목 '${m.term}' 용도 선택`);
          renderHero();
          renderList();
        };
        wrap.appendChild(btn);
      });
    }

    function renderNotebook() {
      const items = loadNotebook();
      const panel = document.getElementById("notebookPanel");
      const wrap = document.getElementById("notebookChips");
      if (!items.length) {
        panel.style.display = "none";
        return;
      }
      panel.style.display = "block";
      wrap.innerHTML = "";
      items.forEach((it) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip-btn saved-chip";
        btn.textContent = `${it.label} · ${it.code}`;
        btn.onclick = () => {
          overrideCode = it.code;
          overridePurpose = it.purposeText || "";
          document.getElementById("searchInput").value = it.rawName || it.label;
          setStatus(`저장된 '${it.label}' 불러옴`);
          renderHero();
          renderList();
        };
        wrap.appendChild(btn);
      });
    }

    function renderList() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const box = document.getElementById("codeList");
      const rows = EXPENSE_ITEMS.filter((item) => {
        const catMatch = activeCat === "전체" || item.cat === activeCat;
        if (!catMatch) return false;
        if (!q) return true;
        return (
          item.code.includes(q) ||
          item.name.toLowerCase().includes(q) ||
          item.desc.toLowerCase().includes(q) ||
          item.keywords.some((k) => k.toLowerCase().includes(q))
        );
      });

      if (!rows.length) {
        box.innerHTML = `<div class="list-item"><div class="list-sub">일치하는 항목이 없습니다. <strong>🌐 인터넷·AI 판별</strong> 버튼을 눌러 보세요.</div></div>`;
        return;
      }

      box.innerHTML = rows
        .map(
          (item) => `
          <div class="list-item">
            <div class="list-code">${item.code}</div>
            <div>
              <div class="list-title">${highlight(item.name, q)} <span style="font-size:13px;font-weight:600;color:var(--muted);">[${item.cat} · ${item.unit}]</span></div>
              <div class="list-sub">${highlight(item.desc, q)}</div>
            </div>
          </div>
        `
        )
        .join("");
    }

    async function doOnlineLookup() {
      const q = document.getElementById("searchInput").value.trim();
      if (!q) {
        setStatus("판별할 품목명이나 상표명을 먼저 입력해 주세요.");
        return;
      }

      setStatus(`'${q}' 인터넷·AI 판별 중...`);

      if (matchMulti(q)) {
        overrideCode = null;
        overridePurpose = "";
        renderHero();
        setStatus(`'${q}'는 용도 선택이 필요한 품목입니다.`);
        return;
      }

      const brand = matchBrand(q);
      if (brand) {
        overrideCode = brand.code;
        overridePurpose = "";
        renderHero();
        setStatus(`상표 확인 완료 → 부호 ${brand.code}`);
        return;
      }

      try {
        const api = `https://ko.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(q)}&limit=3&namespace=0&format=json&origin=*`;
        const resp = await fetch(api);
        if (resp.ok) {
          const data = await resp.json();
          const merged = `${q} ${(data[1] || []).join(" ")} ${(data[2] || []).join(" ")}`;
          const guessed = guessByText(merged);
          overrideCode = guessed.code;
          overridePurpose = "";
          renderHero();
          setStatus(`인터넷 정보 참고 판별 완료 → 부호 ${guessed.code} (${guessed.reason})`);
          return;
        }
      } catch (e) {
        // 오프라인 또는 외부 접속 제한 시 기본 판별 사용
      }

      const fallback = guessByText(q);
      overrideCode = fallback.code;
      overridePurpose = "";
      renderHero();
      setStatus(`기본 판별 적용 → 부호 ${fallback.code} (${fallback.reason})`);
    }

    document.getElementById("searchInput").addEventListener("input", () => {
      overrideCode = null;
      overridePurpose = "";
      setStatus("");
      renderHero();
      renderList();
    });

    document.getElementById("searchInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const q = document.getElementById("searchInput").value.trim();
        if (q && !matchMulti(q) && !matchBrand(q) && !matchCategory(q) && !matchSaved(q)) {
          doOnlineLookup();
        }
      }
    });

    document.getElementById("lookupBtn").addEventListener("click", doOnlineLookup);

    document.getElementById("clearBtn").addEventListener("click", () => {
      document.getElementById("searchInput").value = "";
      overrideCode = null;
      overridePurpose = "";
      setStatus("");
      renderHero();
      renderList();
    });

    document.querySelectorAll(".cat-tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".cat-tab").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        activeCat = btn.dataset.cat;
        renderList();
      });
    });

    document.addEventListener("contextmenu", (e) => e.preventDefault());
    document.addEventListener("copy", (e) => {
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag !== "INPUT" && tag !== "TEXTAREA") {
        e.preventDefault();
      }
    });
    document.addEventListener("selectstart", (e) => {
      const tag = e.target && e.target.tagName;
      if (tag !== "INPUT" && tag !== "TEXTAREA") {
        e.preventDefault();
      }
    });

    renderQuickChips();
    renderNotebook();
    renderList();
  </script>
</body>
</html>
